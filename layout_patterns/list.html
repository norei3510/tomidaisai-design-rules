<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>骨格: 一覧ページ</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="skeleton.css">
</head>
<body>
<!-- 一覧ページ: 見出し → 絞り込み → 一覧。例: 企画一覧・ステージの演目一覧 -->
<div class="page">
  <header class="site-header">
    <a class="site-header__logo" href="/2026/">ロゴ</a>
    <div class="site-header__slot"></div>
  </header>

  <div><!-- 通知バーを出すときだけ .notice を入れる --></div>

  <main class="page__main" id="main">
    <div class="page__inner page__inner--wide">
      <div class="page-head">
        <p class="eyebrow">EVENTS</p>
        <h1 class="h1">企画</h1>
        <p class="lead">［ページの説明を1文で］</p>
      </div>

      <section class="section" aria-label="絞り込み">
        <div class="chip-rail" role="group" aria-label="分類">
          <button class="chip" type="button" aria-pressed="true">すべて</button>
          <button class="chip" type="button" aria-pressed="false">［分類］</button>
          <button class="chip" type="button" aria-pressed="false">［分類］</button>
          <button class="chip" type="button" aria-pressed="false">［分類］</button>
          <button class="chip" type="button" aria-pressed="false">［分類］</button>
        </div>
      </section>

      <section class="section" aria-labelledby="list-title">
        <h2 class="h2" id="list-title">［一覧の見出し］</h2>
        <div class="grid-2">
          <ul class="list" role="list">
            <li><a class="list-item" href="detail.html">
              <span class="list-item__thumb" aria-hidden="true"></span>
              <span class="list-item__body">
                <span class="list-item__title">［企画名］</span>
                <span class="list-item__meta">［場所］・［時間］</span>
              </span>
              <svg class="list-item__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </a></li>
            <li><a class="list-item" href="detail.html">
              <span class="list-item__thumb" aria-hidden="true"></span>
              <span class="list-item__body">
                <span class="list-item__title">［企画名］</span>
                <span class="list-item__meta">［場所］・［時間］</span>
              </span>
              <svg class="list-item__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </a></li>
            <li><a class="list-item" href="detail.html">
              <span class="list-item__thumb" aria-hidden="true"></span>
              <span class="list-item__body">
                <span class="list-item__title">［企画名］</span>
                <span class="list-item__meta">［場所］・［時間］</span>
              </span>
              <svg class="list-item__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </a></li>
          </ul>
          <ul class="list" role="list">
            <li><a class="list-item" href="detail.html">
              <span class="list-item__thumb" aria-hidden="true"></span>
              <span class="list-item__body">
                <span class="list-item__title">［企画名］</span>
                <span class="list-item__meta">［場所］・［時間］</span>
              </span>
              <svg class="list-item__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </a></li>
            <li><a class="list-item" href="detail.html">
              <span class="list-item__thumb" aria-hidden="true"></span>
              <span class="list-item__body">
                <span class="list-item__title">［企画名］</span>
                <span class="list-item__meta">［場所］・［時間］</span>
              </span>
              <svg class="list-item__chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </a></li>
          </ul>
        </div>
      </section>

      <p class="ph">空のとき: 「この条件の企画はありません。条件を減らしてください。」＋［すべて表示］（message.html の空状態）</p>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="サイト">
    <a class="bottom-nav__item" href="/2026/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg></span><span class="bottom-nav__label">TOP</span></a>
    <a class="bottom-nav__item" href="/2026/stage/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></span><span class="bottom-nav__label">ステージ</span></a>
    <a class="bottom-nav__item" href="/2026/events/" aria-current="page"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"/></svg></span><span class="bottom-nav__label">企画</span></a>
    <a class="bottom-nav__item" href="/3190/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.3"/><path d="M15.8 14.1A4.5 4.5 0 0 1 21 18.5"/></svg></span><span class="bottom-nav__label">来場者企画</span></a>
    <a class="bottom-nav__item" href="/2026/map/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4zM9 4v14M15 6v14"/></svg></span><span class="bottom-nav__label">マップ</span></a>
  </nav>
</div>
<script>
  document.querySelectorAll('.chip').forEach((chip) => chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
  }));
</script>
</body>
</html>
