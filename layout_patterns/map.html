<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>骨格: マップ</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="skeleton.css">
</head>
<body>
<!-- マップ: 見出し → 地図（幅いっぱい・比率を保つ）＋［地図を拡大する］→ 場所コードの札で建物を選ぶ → 選んだ建物の企画（サイン板）。
     スマホの幅では地図の上の建物を押し分けられないので、建物を選ぶ主な手段は下の札にする（PAGE_LAYOUT_GUIDE §6）。
     地図の上に場所コードを描き込み、下の札と同じコードにする。地図の上の建物を押せるようにするのは 768px 以上だけでよい。
     拡大は全画面のダイアログ。中は縦横にスクロールでき、指での拡大もできる。
     選んだ建物の情報はダイアログにせず地図の下に出し、そこまでスクロールする（COMPONENT_GUIDE §1.4）。
     GPS の現在地は前提にしない【未定】 -->
<div class="page">
  <header class="site-header">
    <a class="site-header__logo" href="/2026/">ロゴ</a>
    <div class="site-header__slot"></div>
  </header>

  <div></div>

  <main class="page__main" id="main">
    <div class="page__inner page__inner--wide">
      <div class="page-head">
        <h1 class="h1">マップ</h1>
        <p class="page-meta">［建物数］か所・企画［件数］件</p>
      </div>

      <div class="map">
        <figure class="map__figure">
          <div class="ph" style="aspect-ratio: 16 / 10;">［会場の地図。比率は地図画像の実寸に合わせ、全体を見せる。建物ごとに場所コードを描き込む］</div>
          <button class="button button--ghost map__zoom" type="button" id="map-zoom">地図を拡大する</button>
        </figure>

        <dialog class="map-dialog" id="map-dialog" aria-labelledby="map-dialog-title">
          <div class="map-dialog__bar">
            <h2 class="h2" id="map-dialog-title">会場マップ</h2>
            <button class="map-dialog__close" type="button" id="map-close">閉じる</button>
          </div>
          <div class="map-dialog__scroll">
            <div class="ph" style="aspect-ratio: 16 / 10; border: 0; border-radius: 0;">［同じ地図を大きく表示。縦横にスクロールして見る］</div>
          </div>
        </dialog>

        <div class="map__codes" role="group" aria-label="建物を選ぶ">
          <button class="map__code place-code" type="button" aria-pressed="true" data-place="A"><span class="place-code__id">［A］</span><span class="place-code__name">［建物名］</span></button>
          <button class="map__code place-code" type="button" aria-pressed="false" data-place="B2"><span class="place-code__id">［B2］</span><span class="place-code__name">［建物名］</span></button>
          <button class="map__code place-code" type="button" aria-pressed="false" data-place="C"><span class="place-code__id">［C］</span><span class="place-code__name">［建物名］</span></button>
        </div>

        <section class="sign" id="place-detail" aria-labelledby="place-title" tabindex="-1">
          <div class="sign__head">
            <h2 class="place-code place-code--lg" id="place-title"><span class="place-code__id">［A］</span><span class="place-code__name">［建物名］</span></h2>
            <span class="num">［件数］件</span>
          </div>
          <div class="sign__body">
          <ul class="list" role="list">
            <li><a class="list-item" href="detail.html">
              <span class="num list-item__time">［10:00］</span>
              <span class="list-item__body">
                <span class="list-item__title">［企画名］</span>
                <span class="list-item__meta">［団体名］・［部屋］</span>
              </span>
              <span class="now-badge">開催中</span>
            </a></li>
            <li><a class="list-item" href="detail.html">
              <span class="num list-item__time">［11:00］</span>
              <span class="list-item__body">
                <span class="list-item__title">［企画名］</span>
                <span class="list-item__meta">［団体名］・［部屋］</span>
              </span>
            </a></li>
          </ul>
          <a class="button button--ghost" href="list.html">［A］の企画を一覧で見る</a>
          </div>
        </section>

        <p class="ph">建物を選ぶ前: サイン板の代わりに「建物を選ぶと、その建物の企画が出ます。」。企画のない建物: 「この建物に企画はありません。」＋トイレ・休憩所など設備があれば1行</p>
      </div>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="サイト">
    <a class="bottom-nav__item" href="/2026/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg></span><span class="bottom-nav__label">TOP</span></a>
    <a class="bottom-nav__item" href="/2026/stage/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></span><span class="bottom-nav__label">ステージ</span></a>
    <a class="bottom-nav__item" href="/2026/events/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"/></svg></span><span class="bottom-nav__label">企画</span></a>
    <a class="bottom-nav__item" href="/3190/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.3"/><path d="M15.8 14.1A4.5 4.5 0 0 1 21 18.5"/></svg></span><span class="bottom-nav__label">来場者企画</span></a>
    <a class="bottom-nav__item" href="/2026/map/" aria-current="page"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4zM9 4v14M15 6v14"/></svg></span><span class="bottom-nav__label">マップ</span></a>
  </nav>
</div>
<script>
  const dialog = document.getElementById('map-dialog');
  document.getElementById('map-zoom').addEventListener('click', () => dialog.showModal());
  document.getElementById('map-close').addEventListener('click', () => dialog.close());
  const detail = document.getElementById('place-detail');
  document.querySelectorAll('.map__code').forEach((code, _, all) => code.addEventListener('click', () => {
    all.forEach((c) => c.setAttribute('aria-pressed', String(c === code)));
    detail.focus({ preventScroll: true });
    detail.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }));
</script>
</body>
</html>
