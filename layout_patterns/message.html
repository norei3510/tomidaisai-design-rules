<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>骨格: 結果・空・エラーのページ</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="skeleton.css">
</head>
<body>
<!-- 結果・空・エラー: 中央に印 → 見出し → 1〜2文 → 次の操作1つ（＋控えめな操作）。
     例: 完了画面、見つからないページ、通信できないとき。下の切り替えは骨格の確認用 -->
<div class="page">
  <header class="site-header">
    <a class="site-header__logo" href="/2026/">ロゴ</a>
    <div class="site-header__slot"></div>
  </header>

  <div></div>

  <main class="page__main" id="main">
    <section class="message" aria-live="polite">
      <div class="message__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" id="mark"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </div>
      <h1 class="h1" id="title">受付が完了しました</h1>
      <p class="lead" id="body">［何が終わったか・次に何をするかを1〜2文］</p>
      <div class="section" style="width: min(100%, var(--content-max));">
        <a class="button button--primary button--block" id="primary" href="/2026/">トップページへ</a>
        <a class="button button--ghost button--block" href="/2026/map/">マップを見る</a>
      </div>
      <div class="chip-rail" role="group" aria-label="骨格の状態を切り替え（実ページでは消す）" style="margin: 0;">
        <button class="chip" type="button" data-state="done" aria-pressed="true">完了</button>
        <button class="chip" type="button" data-state="empty" aria-pressed="false">空</button>
        <button class="chip" type="button" data-state="error" aria-pressed="false">エラー</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="サイト">
    <a class="bottom-nav__item" href="/2026/" aria-current="page"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg></span><span class="bottom-nav__label">TOP</span></a>
    <a class="bottom-nav__item" href="/2026/stage/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></span><span class="bottom-nav__label">ステージ</span></a>
    <a class="bottom-nav__item" href="/2026/events/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"/></svg></span><span class="bottom-nav__label">企画</span></a>
    <a class="bottom-nav__item" href="/3190/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.3"/><path d="M15.8 14.1A4.5 4.5 0 0 1 21 18.5"/></svg></span><span class="bottom-nav__label">来場者企画</span></a>
    <a class="bottom-nav__item" href="/2026/map/"><span class="bottom-nav__pill"><svg class="bottom-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4zM9 4v14M15 6v14"/></svg></span><span class="bottom-nav__label">マップ</span></a>
  </nav>
</div>
<script>
  const states = {
    done:  { mark: 'm5 12.5 4.5 4.5L19 7.5', title: '受付が完了しました', body: '［何が終わったか・次に何をするかを1〜2文］', primary: 'トップページへ' },
    empty: { mark: 'M4 7h16M4 12h16M4 17h10', title: '該当する企画はありません', body: '条件を減らすと、ほかの企画が見つかります。', primary: '条件をリセット' },
    error: { mark: 'M12 7v6M12 16.5v.5', title: '読み込めませんでした', body: '通信が不安定です。電波のよい場所で、もう一度お試しください。', primary: 'もう一度読み込む' },
  };
  document.querySelectorAll('[data-state]').forEach((chip) => chip.addEventListener('click', () => {
    const s = states[chip.dataset.state];
    document.querySelector('#mark path').setAttribute('d', s.mark);
    document.getElementById('title').textContent = s.title;
    document.getElementById('body').textContent = s.body;
    document.getElementById('primary').textContent = s.primary;
    document.querySelectorAll('[data-state]').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
  }));
</script>
</body>
</html>
